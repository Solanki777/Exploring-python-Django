{% extends "base.html" %} {% block start %}


<div class="card-body p-5">

    {% if error %}
    <div class="alert alert-danger">
        {{ error }}
    </div>
    {% endif %}

  

</div>
<div class="container mt-5">
  <div class="card shadow-lg mx-auto border-0" style="max-width: 1000px">
    <div class="card-header bg-success text-white text-center py-3">
      <h2>Registration</h2>
    </div>

    <div class="card-body p-5">
      {% comment %} to upload file must use enctype {% endcomment %}

      <form method="POST">
        {% csrf_token %}
        <div class="form-group">
          <label for="exampleInputEmail1">Fisrt name</label>
          <input
            type="name"
            name="first_name"
            class="form-control"
            id="fname"
          />
        </div>
        <div class="form-group">
          <label for="exampleInputEmail1">last name</label>
          <input
            type="name"
            name="last_name"
            class="form-control"
            id="username"
          />
        </div>
        <div class="form-group">
          <label for="exampleInputEmail1">User name</label>
          <input
            type="name"
            name="username"
            class="form-control"
            id="username"
          />
        </div>
        <div class="form-group">
          <label for="exampleInputPassword1">Password</label>
          <input
            type="password"
            class="form-control"
            id="exampleInputPassword1"
            name="password"
          />
        </div>
        <P>Already have account <a href="/login">Click here</p>
        <button type="submit" class="btn btn-primary">Submit</button>
      </form>
    </div>
  </div>
</div>

{% endblock %}
